name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_url:
        description: 'PR URL to review (for manual triggers)'
        required: true
        type: string

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Review PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine PR URL from event context or manual input
          if [[ -n "${{ github.event.pull_request.html_url }}" ]]; then
            PR_URL="${{ github.event.pull_request.html_url }}"
          else
            PR_URL="${{ github.event.inputs.pr_url }}"
          fi

          chmod +x ./claude-review
          ./claude-review --pr "$PR_URL" --post-comment
